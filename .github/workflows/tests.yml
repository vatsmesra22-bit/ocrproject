# CI: on every push / pull request GitHub runs all tests. A red X means
# something broke - don't put that version on the rack.
# Tests use made-up data only; no secrets or customer data are needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCR_ENGINE: local
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
